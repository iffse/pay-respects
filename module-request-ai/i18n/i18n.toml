_version = 2

[ai-suggestion]
en = "Suggestion from AI"
es = "Sugerencia de la IA"
de = "Vorschlag von KI"
fr = "Suggestion de l'IA"
it = "Proposta dall'IA"
pt = "Sugestão da IA"
ru = "Предложение от ИИ"
ja = "AIからの提案"
ko = "AI 제안"
zh = "AI 建议"

[ai-thinking]
en = "AI is thinking..."
es = "La IA está pensando..."
de = "KI denkt nach..."
fr = "L'IA réfléchit..."
it = "L'IA sta pensando..."
pt = "A IA está pensando..."
ru = "ИИ думает..."
ja = "AIが考えています..."
ko = "AI가 생각 중입니다..."
zh = "AI正在思考..."

[ai-consent-prompt]
en = "AI suggestions are sent to an external server. Do you want to use the built-in API key?"
es = "Las sugerencias de IA se envían a un servidor externo. ¿Quieres usar la clave de API integrada?"
de = "KI-Vorschläge werden an einen externen Server gesendet. Möchtest du den eingebauten API-Schlüssel verwenden?"
fr = "Les suggestions de l'IA sont envoyées à un serveur externe. Voulez-vous utiliser la clé API intégrée ?"
it = "I suggerimenti dell'IA vengono inviati a un server esterno. Vuoi usare la chiave API integrata?"
pt = "As sugestões da IA são enviadas para um servidor externo. Você quer usar a chave de API integrada?"
ru = "Предложения ИИ отправляются на внешний сервер. Использовать встроенный ключ API?"
ja = "AI の提案は外部サーバーに送信されます。組み込みの API キーを使用しますか？"
ko = "AI 제안은 외부 서버로 전송됩니다. 내장 API 키를 사용하시겠습니까?"
zh = "AI 建议会发送到外部服务器。要使用内置 API 密钥吗？"

[ai-consent-builtin]
en = "Yes, use the built-in API key"
es = "Sí, usar la clave de API integrada"
de = "Ja, eingebauten API-Schlüssel verwenden"
fr = "Oui, utiliser la clé API intégrée"
it = "Sì, usa la chiave API integrata"
pt = "Sim, usar a chave de API integrada"
ru = "Да, использовать встроенный ключ API"
ja = "はい、組み込みの API キーを使用する"
ko = "예, 내장 API 키 사용"
zh = "是，使用内置 API 密钥"

[ai-consent-builtin-always]
en = "Yes, use the built-in API key (always)"
es = "Sí, usar la clave de API integrada (siempre)"
de = "Ja, eingebauten API-Schlüssel verwenden (immer)"
fr = "Oui, utiliser la clé API intégrée (toujours)"
it = "Sì, usa la chiave API integrata (sempre)"
pt = "Sim, usar a chave de API integrada (sempre)"
ru = "Да, использовать встроенный ключ API (всегда)"
ja = "はい、組み込みの API キーを常に使用する"
ko = "예, 항상 내장 API 키 사용"
zh = "是，始终使用内置 API 密钥"

[ai-consent-disable]
en = "No, disable AI suggestions (always)"
es = "No, desactivar las sugerencias de IA (siempre)"
de = "Nein, KI-Vorschläge deaktivieren (immer)"
fr = "Non, désactiver les suggestions de l'IA (toujours)"
it = "No, disattiva i suggerimenti dell'IA (sempre)"
pt = "Não, desativar as sugestões da IA (sempre)"
ru = "Нет, отключить предложения ИИ (всегда)"
ja = "いいえ、AI の提案を常に無効にする"
ko = "아니요, 항상 AI 제안 비활성화"
zh = "否，始终禁用 AI 建议"
