[package]
name = "pay-respects-rule-engine"
version = "0.1.0"
edition = "2024"

# for crates.io
description = "Rule IR and evaluator for the pay-respects CLI tool"
homepage = "https://codeberg.org/iff/pay-respects"
repository = "https://github.com/iffse/pay-respects"
license = "MPL-2.0"
include = ["**/*.rs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.0" }
postcard = { version = "1.1", features = ["alloc"] }

pay-respects-utils = { version = "0.2", path = "../utils" }
