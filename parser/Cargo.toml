[package]
name = "pay-respects-parser"
version = "0.3.16"
edition = "2024"

# for crates.io
description = "Compile time rule parser for the pay-respects CLI tool"
repository = "https://github.com/iffse/pay-respects"
license = "MPL-2.0"
include = [
	"**/*.rs",
	"**/*.toml",
]

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
proc-macro2 = "1.0"
postcard = { version = "1.1", features = ["alloc"] }
pay-respects-rule-engine = { version = "0.1", path = "../rule-engine" }
