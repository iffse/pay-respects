version = 2
commands = [
	'_PR_fallback',
]

[[match]]
error = [
	'access',
	'permission',
	'permitted',
	'privilege',
	'protected',
	'root',
	'sudo',
	'super-user',
	'superuser',
]

[[match.suggest]]
function = 'SetPrivilege'

[[match]]

[[match.suggest]]
when = [
	'min_length(2)',
]
inline = true
function = 'DesperateFileLookUp'

[[match.suggest]]
inline = true
function = 'DesperateFuzzyRecovery'
