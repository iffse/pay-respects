version = 2
commands = [
	'touch',
]

[[match]]
error = [
	'no such file or directory',
]

[[match.suggest]]
when = [
	'!shell(nu)',
]
run = '''mkdir -p {{cmd::(?:\s)+(.*[\\\/])(?:\s)*}} &&
touch {{command[1:]}}'''

[[match]]
error = [
	'nu::shell::create_not_possible',
	'no such file or directory',
]

[[match.suggest]]
when = [
	'shell(nu)',
]
run = '''mkdir {{cmd::(?:\s)+(.*[\\\/])(?:\s)*}};
touch {{command[1:]}}'''
