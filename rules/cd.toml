version = 2
commands = [
	'cd',
	'z',
	'__zoxide_z',
	'Set-Location',
]

[[match]]

[[match.suggest]]
when = [
	'length(2)',
]
inline = true
run = '''{{command[0]}} {{typo[1](file)}}'''

[[match.suggest]]
when = [
	'min_length(2)',
]
inline = true
function = 'ZoxideIntegration'

[[match.suggest]]
when = [
	'!shell(nu)',
	'length(2)',
]
run = '''mkdir --parents {{command[1]}} &&
cd {{command[1]}}'''

[[match.suggest]]
when = [
	'shell(nu)',
	'length(2)',
]
run = '''mkdir {{command[1]}} and \
cd {{command[1]}}'''
