version = 2
commands = [
	'_PR_general',
]

[[match]]
error = [
	'command not found',
	'unknown command',
	'nu::shell::external_command',
	'is not recognized as a name of a cmdlet',
]

[[match.suggest]]
run = '''{{select[0](path)}} {{command[1:]}}'''

[[match.suggest]]
when = [
	'cmd_contains(^cd\.\.$)',
]
inline = true
run = '''cd ..'''

[[match.suggest]]
when = [
	'cmd_contains(^cs(?:\s|$))',
]
inline = true
run = '''cd {{command[1:]}}'''

[[match.suggest]]
when = [
	'cmd_contains(^\s*\$\s)',
]
run = '''{{command[1:]}}'''

[[match.suggest]]
when = [
	'cmd_contains(^man\S+$)',
]
run = '''man {{cmd::^man(\S+)$}}'''

[[match.suggest]]
when = [
	'cmd_contains(^\S+\.py(?:\s|$))',
]
run = '''python {{command}}'''

[[match]]
error = [
	'for details',
	'for more information',
]

[[match.suggest]]
run = '''{{err::(?:Run|Try) '([^']+)' for (?:details|more information)}}'''

[[match]]
error = [
	'permission denied',
	'is not an executable file',
]

[[match.suggest]]
when = [
	'cmd_contains((?m)^(\S*)\/(\S*))',
]
run = '''chmod +x {{command[0]}} &&
{{command}}'''

[[match.suggest]]
when = [
	'cmd_contains(^\S+\.py(?:\s|$))',
]
run = '''python {{command}}'''
