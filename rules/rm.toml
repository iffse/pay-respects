version = 2
commands = [
	'rm',
]

[[match]]
error = [
	'is a directory',
	'try --recursive',
]

[[match.suggest]]
run = '''{{command[0]}} -r {{command[1:]}}'''

[[match]]
error = [
	'write-protected',
]

[[match.suggest]]
run = '''{{command[0]}} -f {{command[1:]}}'''

[[match]]
error = [
	'no such file or directory',
	'file(s) not found',
]

[[match.suggest]]
run = '''{{command[0]}} {{opt::(?:\s)(-[\w]+)}} {{typo[1:](file)}}'''
