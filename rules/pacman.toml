version = 2
commands = [
	'pacman',
	'paru',
	'yay',
]

[[match]]
error = [
	'no operation specified',
]

[[match.suggest]]
when = [
	'length(1)',
]
run = '''{{command}} -Syu'''

[[match.suggest]]
when = [
	'min_length(2)',
]
run = '''{{command[0]}} -S {{command[1:]}}'''

[[match]]
error = [
	'no targets specified',
]

[[match.suggest]]
when = [
	'cmd_contains(-S)',
]
run = '''{{command[0]}} -Syu'''
