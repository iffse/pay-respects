version = 2
commands = [
	'cargo',
]

[[match]]
error = [
	'no such command',
]

[[match.suggest]]
when = [
	'err_contains(did you mean)',
]
run = '''{{command[0]}} {{err::(?:Did you mean `)(.*)(?:`\?)}} {{command[2:]}}'''

[[match.suggest]]
when = [
	'err_contains(a command with a similar name exists)',
]
run = '''{{command[0]}} {{err::(?:a command with a similar name exists: `)(\S+)(?:`)}} {{command[2:]}}'''

[[match.suggest]]
when = [
	'!err_contains(did you mean)',
	'!err_contains(a command with a similar name exists)',
]
run = '''{{command[0]}} {{typo[1](
add,
bench,
build,
check,
clean,
clippy,
config,
deb,
doc,
expand,
fetch,
fix,
fmt,
generate-lockfil,
generate-rpm,
git-checkout,
help,
info,
init,
install,
lipo,
locate-project,
login,
logout,
make,
metadata,
miri,
new,
owner,
package,
pkgid,
publish,
read-manifest,
remove,
report,
rm,
run,
rustc,
rustdoc,
search,
test,
tree,
uninstall,
update,
vendor,
verify-project,
version,
yank
)}} {{command[2:]}}'''

[[match]]
error = [
	'requires the features',
]

[[match.suggest]]
when = [
	'err_contains(consider enabling them by passing)',
]
run = '''{{command}} {{err::(?:`)(--features=.*")(?:`)}}'''

[[match]]
error = [
	'using `cargo install` to install the binaries from the package in current working directory is no longer supported',
]

[[match.suggest]]
run = '''{{command}} --path .'''
