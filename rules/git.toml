version = 2
commands = [
	'git',
]

[[match]]
error = [
	'is not a git command',
]

[[match.suggest]]
when = [
	'err_contains(the most similar command is)',
]
run = '''{{command[0]}} {{err::(?:The most similar command is )(\S+)}} {{command[2:]}}'''

[[match.suggest]]
when = [
	'!err_contains(the most similar command is)',
]
inline = true
run = '''{{command[0]}} {{typo[1](
add,
am,
archive,
bisect,
branch,
bundle,
checkout,
cherry-pick,
citool,
clean,
clone,
commit,
describe,
diff,
fetch,
format-patch,
gc,
gitk,
grep,
gui,
init,
log,
maintenance,
merge,
mv,
notes,
pull,
push,
range-diff,
rebase,
reset,
restore,
revert,
rm,
scalar,
shortlog,
show,
sparse-checkout,
stash,
status,
submodule,
switch,
tag,
worktree,
config,
fast-export,
fast-import,
filter-branch,
mergetool,
pack-refs,
prune,
reflog,
remote,
repack,
replace,
)}} {{command[2:]}}'''

[[match]]
error = [
	'did not match any file',
]

[[match.suggest]]
when = [
	'cmd_contains(checkout)',
]
run = '''git checkout {{typo[2]({{shell(git branch | sed 's/^*//')}})}}'''

[[match.suggest]]
when = [
	'cmd_contains(checkout)',
]
run = '''git checkout -b {{command[2]}}'''

[[match]]
error = [
	'has no upstream branch',
	'No configured push destination.',
]

[[match.suggest]]
when = [
	'cmd_contains(push)',
]
run = '''git push --set-upstream {{select({{shell(git remote)}})}} {{shell(git rev-parse --abbrev-ref HEAD)}}'''

[[match]]
error = [
	'no tracking information for the current branch',
]

[[match.suggest]]
when = [
	'cmd_contains(pull)',
]
run = '''git pull --set-upstream {{select({{shell(git remote)}})}} {{shell(git rev-parse --abbrev-ref HEAD)}}'''

[[match]]
error = [
	'a branch named',
]

[[match.suggest]]
when = [
	'cmd_contains(branch)',
]
run = '''git checkout {{command[2]}}'''

[[match]]
error = [
	'updates were rejected',
]

[[match.suggest]]
when = [
	'cmd_contains(push)',
]
run = '''git pull &&
{{command}}'''

[[match.suggest]]
when = [
	'cmd_contains(push)',
]
run = '''{{command}} --force'''

[[match]]
error = [
	'you have unstaged changes',
	'stash them',
]

[[match.suggest]]
when = [
	'cmd_contains(pull)',
]
run = '''{{command}} --rebase --autostash'''

[[match.suggest]]
run = '''git stash &&
{{command}} &&
git stash pop'''

[[match]]
error = [
	'you have divergent branches and need to specify how to reconcile them',
]

[[match.suggest]]
when = [
	'cmd_contains(pull)',
]
run = '''{{command}} --rebase'''

[[match.suggest]]
when = [
	'cmd_contains(pull)',
]
run = '''{{command}} --no-rebase'''

[[match]]
error = [
	'is not fully merged',
]

[[match.suggest]]
when = [
	'cmd_contains(branch -d)',
]
run = '''{{command[:1]}} -D {{command[3:]}}'''

[[match]]
error = [
	'Changes not staged for commit',
]

[[match.suggest]]
run = '''git add .'''

[[match]]
error = [
	'use "git push" to publish your local commits',
]

[[match.suggest]]
run = '''git push'''

[[match]]
error = [
	'Nothing specified',
]

[[match.suggest]]
when = [
	'cmd_contains(add)',
]
run = '''git add .'''

[[match]]
error = [
	'fatal: not a git repository',
]

[[match.suggest]]
run = '''git init'''

[[match]]
error = [
	'would clobber existing tag',
]

[[match.suggest]]
when = [
	'cmd_contains(tag)',
]
run = '''{{command}} --force'''

[[match]]
error = [
	'fatal: invalid reference:',
]

[[match.suggest]]
when = [
	'cmd_contains(switch)',
]
run = '''{{command[0]}} switch -c {{command[2:]}}'''
