version = 2
commands = [
	'jj',
]

[[match]]
error = [
	'There is no jj repo in "."',
]

[[match.suggest]]
run = '''{{command[0]}} git init'''

[[match]]
error = [
	'unrecognized subcommand',
]

[[match.suggest]]
when = [
	"err_contains('git')",
]
run = '''{{command[0]}} git {{command[2:]}}'''

[[match.suggest]]
when = [
	'cmd_contains(\s((push)|(fetch)|(clone)|(init)|(remote)))',
]
inline = true
run = '''{{command[0]}} git {{command[1:]}}'''

[[match.suggest]]
when = [
	'cmd_contains(\s(pull))',
]
inline = true
run = '''{{command[0]}} git fetch'''

[[match]]
error = [
	'error: commit',
	'is immutable`',
	'pass `--ignore-immutable`', # deprecated
]

[[match.suggest]]
run = '''{{command}} --ignore-immutable'''

[[match]]
error = [
	'no bookmarks found in the default push revset',
]

[[match.suggest]]
run = '''{{command}} --change @'''

[[match]]
error = [
	'hint: run',
	'and try again',
]

[[match.suggest]]
run = '''{{err::Hint: Run `(.*)` and try again.}} &&
{{command}}'''

[[match.suggest]]
run = '''{{err::Hint: Run `(.*)` and try again.}}'''

# deprecated
[[match]]
error = [
	'use --allow-new to push new bookmark',
]

[[match.suggest]]
run = '''{{command}} --allow-new'''
