version = 2
commands = [
	'yarn',
]

[[match]]
error = [
	'not found',
]

[[match.suggest]]
when = [
	'err_contains(command)',
]
run = '''{{command[0]}} {{typo[1](
access,
add,
audit,
autoclean,
bin,
cache,
check,
config,
create,
exec,
generate-lock-entry,
generateLockEntry,
global,
help,
import,
info,
init,
install,
licenses,
link,
list,
login,
logout,
node,
outdated,
owner,
pack,
policies,
publish,
remove,
run,
tag,
team,
unlink,
unplug,
upgrade,
upgrade-interactive,
upgradeInteractive,
version,
versions,
why,
workspace,
workspaces
)}} {{command[2:]}}'''

[[match]]
error = [
	'`install` has been replaced with `add`',
]

[[match.suggest]]
run = '''yarn add {{command[2:]}}'''
