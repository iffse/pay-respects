version = 2
commands = [
	'cp',
]

[[match]]
error = [
	'-r not specified',
]

[[match.suggest]]
run = '''{{command[0]}} -r {{command[1:]}}'''

[[match]]
error = [
	'cannot create',
]

[[match.suggest]]
when = [
	'err_contains(no such file or directory)',
]
run = '''mkdir -p {{cmd::(?m)\s(\S+[\\\/])\S*\s*$}} &&
{{command[0]}} {{opt::(?:\s)(-[\w]+)}} {{command[1:]}}'''
